name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Collect platform-specific artifacts + signatures into a flat directory
      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe.sig artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi.sig artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: eet-mod-runner-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts/ -type f | sort

      # Generate latest.json for the Tauri updater
      - name: Generate updater manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="Anprionsa/eet-mod-runner"
          TAG="${GITHUB_REF_NAME}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="EET Mod Runner ${TAG} — see release notes for details."

          # Read signatures
          WIN_SIG=""
          LINUX_SIG=""
          MAC_SIG=""

          if [ -f "artifacts/EET Mod Runner_${VERSION}_x64-setup.exe.sig" ]; then
            WIN_SIG=$(cat "artifacts/EET Mod Runner_${VERSION}_x64-setup.exe.sig")
          fi
          if ls artifacts/*.AppImage.sig 1>/dev/null 2>&1; then
            LINUX_SIG=$(cat artifacts/*.AppImage.sig | head -1)
          fi
          if ls artifacts/*.app.tar.gz.sig 1>/dev/null 2>&1; then
            MAC_SIG=$(cat artifacts/*.app.tar.gz.sig | head -1)
          fi

          # Build latest.json
          cat > artifacts/latest.json << MANIFEST
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/EET.Mod.Runner_${VERSION}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/EET.Mod.Runner_${VERSION}_amd64.AppImage"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/EET.Mod.Runner_${VERSION}_aarch64.app.tar.gz"
              }
            }
          }
          MANIFEST

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: "EET Mod Runner ${{ github.ref_name }}"
          body: "See [CHANGELOG](https://github.com/Anprionsa/eet-mod-runner#changelog) for details."
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

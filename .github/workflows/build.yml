name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Collect platform-specific artifacts + signatures into a flat directory
      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe.sig artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi.sig artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: infinity-mod-runner-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: warn

      # ─── Authenticode signing via SignPath.io OSS (Phase 16a) ───
      #
      # State: stub only. Until the SignPath.io Open-Source application is
      # approved AND repository secrets + vars are configured, these steps
      # are commented out and the Windows installer ships unsigned. The
      # user-facing SmartScreen warning is documented in README's
      # "First-launch warnings" section.
      #
      # Activation procedure (once SignPath approves the project):
      #   1. Create an API token in SignPath.io and add repo secrets:
      #         SIGNPATH_API_TOKEN    — the signing API token
      #         SIGNPATH_ORG_ID       — your SignPath organization GUID
      #   2. Add a repository variable:
      #         ENABLE_SIGNPATH = "true"
      #      (acts as a master switch; forks without it set skip signing)
      #   3. Update the slug values below to match what SignPath assigned
      #      (`project-slug`, `signing-policy-slug`, `artifact-configuration-slug`).
      #   4. Uncomment the two steps. Push a tag. The SignPath action will
      #      download the uploaded unsigned artifact via its GitHub
      #      artifact id, sign the `.exe`/`.msi` inside, and emit the signed
      #      files to `artifacts-signed/`. A subsequent upload re-uploads
      #      them under a `-signed` suffix; the release job below picks
      #      them up via `merge-multiple: true`.
      #
      # See docs/CODE_SIGNING.md for the full maintainer walkthrough.

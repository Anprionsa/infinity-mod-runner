      #   with:
      #     name: infinity-mod-runner-${{ matrix.platform }}-signed
      #     path: artifacts-signed/
      #     if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts/ -type f | sort

      # Generate latest.json for the Tauri updater
      - name: Generate updater manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="Anprionsa/infinity-mod-runner"
          TAG="${GITHUB_REF_NAME}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="Infinity Mod Runner ${TAG} — see release notes for details."

          # Read signatures
          WIN_SIG=""
          LINUX_SIG=""
          MAC_SIG=""

          if [ -f "artifacts/Infinity Mod Runner_${VERSION}_x64-setup.exe.sig" ]; then
            WIN_SIG=$(cat "artifacts/Infinity Mod Runner_${VERSION}_x64-setup.exe.sig")
          fi
          if ls artifacts/*.AppImage.sig 1>/dev/null 2>&1; then
            LINUX_SIG=$(cat artifacts/*.AppImage.sig | head -1)
          fi
          if ls artifacts/*.app.tar.gz.sig 1>/dev/null 2>&1; then
            MAC_SIG=$(cat artifacts/*.app.tar.gz.sig | head -1)
          fi

          # Build latest.json
          cat > artifacts/latest.json << MANIFEST
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Infinity.Mod.Runner_${VERSION}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Infinity.Mod.Runner_${VERSION}_amd64.AppImage"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Infinity.Mod.Runner_${VERSION}_aarch64.app.tar.gz"
              }
            }
          }
          MANIFEST

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: "Infinity Mod Runner ${{ github.ref_name }}"
          body: "See [CHANGELOG](https://github.com/Anprionsa/infinity-mod-runner#changelog) for details."
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
